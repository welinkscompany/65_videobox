server {
    listen 8080;
    server_name _;

    # The API accepts uploads up to 128MB; nginx defaults to 1MB and
    # answers with an HTML 413 the app never sees. Sit above the app's
    # ceiling so its own Korean message is the one that reaches the owner.
    client_max_body_size 160m;

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://videobox-api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
