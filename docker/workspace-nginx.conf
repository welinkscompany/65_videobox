pid /tmp/nginx.pid;
error_log /tmp/nginx-error.log notice;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /tmp/nginx-access.log;
    client_body_temp_path /tmp/nginx-client-body;
    proxy_temp_path /tmp/nginx-proxy;
    fastcgi_temp_path /tmp/nginx-fastcgi;
    uwsgi_temp_path /tmp/nginx-uwsgi;
    scgi_temp_path /tmp/nginx-scgi;

    server {
        listen 8080;
        server_name _;

        # The API accepts uploads up to 128MB; nginx defaults to 1MB and
        # answers with an HTML 413 the app never sees. Sit above the app's
        # ceiling so its own Korean message is the one that reaches the owner.
        client_max_body_size 160m;

        root /app/apps/web/dist;
        index index.html;

        location = /health {
            proxy_pass http://127.0.0.1:8000/health;
        }

        location /api/ {
            proxy_pass http://127.0.0.1:8000;
            # 그림 한 장이 22~24초 걸린다(2026-08-21 실측). nginx 기본 60초로는
            # 끝나기 전에 잘리고, 화면은 제품이 고장 난 것처럼 504 HTML을 받는다.
            # 업로드 1MB 벽과 같은 자리다 -- 이 저장소의 테스트는 프록시를 한 번도
            # 안 지나므로 앱 쪽 상한과 어긋나기 쉽다. 앱의
            # VIDEOBOX_IMAGE_TIMEOUT_SECONDS(300)보다 위에 둔다.
            proxy_read_timeout 330s;
            proxy_send_timeout 330s;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
