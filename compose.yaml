name: 65_videobox

# Compose ignores extension fields. This declares capability authority
# ownership; base Compose keeps capability issuance and lifecycle disabled.
# The hermes-yujin overlay is the only deployed C3 authority profile.
x-videobox-hermes-capability-authority:
  schema_version: v1
  issuer: videobox-agent-gateway
  issuer_owner: gateway-only
  issuance_enabled: false
  signing_secret_delivery: forbidden
  durable_revocation_storage_primitive: LocalProjectStore.revoke_hermes_capability
  owner_authorized_revocation_writer_status: not_deployed
  durable_consume_replay_boundary: ProjectStore.consume_hermes_capability
  capability_gateway_route_status: not_deployed
  signing_private_key_status: not_deployed
  verification_public_key_status: not_deployed
  capability_lifecycle_status: disabled
  gateway_audit_status: disabled
  key_replacement_mode: not_deployed
  ordinary_api_paths: forbidden
  preauth_hermes_network_status: network_mode_none
  yujin_topology_status: deployed
  gateway_service_status: health_only
  gateway_service: videobox-agent-gateway
  gateway_api_network: videobox-agent-gateway-api-network
  gateway_network: videobox-agent-gateway-network
  gateway_route_mode: gateway-only

services:
  videobox-postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-videobox}
      POSTGRES_USER: ${POSTGRES_USER:-videobox}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env.container}
    volumes:
      - videobox_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [videobox-internal]
    security_opt: [no-new-privileges:true]
    # The only service that had no cap. A database writes its loudest logs
    # exactly when it is already unhealthy, so an unbounded file here fills the
    # disk at the worst possible moment.
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"

  videobox-workspace:
    build:
      context: .
      dockerfile: docker/workspace.Dockerfile
    environment:
      VIDEOBOX_DATA_ROOT: /videobox-data
      VIDEOBOX_SNAPSHOT_ROOT: /videobox-snapshot
      # PID 1 runs `uvicorn ... create_app --factory`, so the factory gets no
      # arguments and resolves these instead of defaulting to the mock
      # transcriber.  Model weights download on first real use.
      VIDEOBOX_STT_ENABLED: ${VIDEOBOX_STT_ENABLED:-1}
      VIDEOBOX_STT_MODEL_SIZE: ${VIDEOBOX_STT_MODEL_SIZE:-small}
      VIDEOBOX_STT_DEVICE: ${VIDEOBOX_STT_DEVICE:-cpu}
      VIDEOBOX_STT_COMPUTE_TYPE: ${VIDEOBOX_STT_COMPUTE_TYPE:-int8}
      VIDEOBOX_STT_LANGUAGE: ${VIDEOBOX_STT_LANGUAGE:-ko}
      # Must match whatever model is actually loaded in LM Studio -- the
      # hardcoded default ("qwen3-35b") drifted from the real loaded model
      # name (qwen/qwen3.6-35b-a3b) and this override closes that gap
      # without a code change.
      VIDEOBOX_LOCAL_MODEL_NAME: ${VIDEOBOX_LOCAL_MODEL_NAME:-qwen3-35b}
      # LM Studio runs on the host.  Inside the container 127.0.0.1 is the
      # container, so the on-screen Yujin chat could not reach a brain at all
      # and failed as "a transient network error".  Owner approved this one
      # host path on 2026-08-08 (`docs/development-fast-path.ko.md` §10.14 2-B).
      VIDEOBOX_LOCAL_RUNTIME_BASE_URL: ${VIDEOBOX_LOCAL_RUNTIME_BASE_URL:-http://host.docker.internal:1234/v1}
      # B-roll analysis (Task 19) was activated in code but never carried into
      # compose, so the container fell back to the unavailable worker and every
      # analysis came back blocked.  Uses the same LM Studio as the line above.
      VIDEOBOX_MEDIA_ANALYSIS_ENABLED: ${VIDEOBOX_MEDIA_ANALYSIS_ENABLED:-1}
      # Drop-folder import. The watcher was written for "whatever a Drive
      # desktop client syncs to disk" (settings.py), and Google Drive's
      # streaming drive (G:) cannot be bind-mounted -- Docker mounts it and
      # sees an empty directory. So the watched folder is a real host folder
      # the owner can point Drive's mirror at, or drop files into by hand.
      VIDEOBOX_MEDIA_INBOX_WATCH_ENABLED: ${VIDEOBOX_MEDIA_INBOX_WATCH_ENABLED:-1}
      # A subfolder, so the archive folder VideoBox files originals into lands
      # beside it inside the same mount: .../새 영상 -> .../가져옴.
      VIDEOBOX_MEDIA_INBOX_WATCH_PATH: /videobox-drive-sync/새 영상
      VIDEOBOX_MEDIA_INBOX_WATCH_INTERVAL_SECONDS: ${VIDEOBOX_MEDIA_INBOX_WATCH_INTERVAL_SECONDS:-30}
      # The root filesystem stays read-only, so model weights need their own
      # writable home.  Keeping it off /tmp avoids re-downloading on restart and
      # keeps weights out of the owner's project data.
      HF_HOME: /opt/models
      XDG_CACHE_HOME: /opt/models
      # Draft export for CapCut.  Size is configurable because the owner shoots
      # 1920x1080 and also needs a vertical canvas for shortform.
      VIDEOBOX_CAPCUT_ENABLED: ${VIDEOBOX_CAPCUT_ENABLED:-1}
      VIDEOBOX_CAPCUT_WIDTH: ${VIDEOBOX_CAPCUT_WIDTH:-1920}
      VIDEOBOX_CAPCUT_HEIGHT: ${VIDEOBOX_CAPCUT_HEIGHT:-1080}
      VIDEOBOX_CAPCUT_FPS: ${VIDEOBOX_CAPCUT_FPS:-30}
      # Owner decision (2026-08-05, Task 21, Option A): place everything
      # automatically; review the actual result afterward rather than
      # gating approval on a confidence heuristic before anything renders.
      VIDEOBOX_AUTO_APPROVE_SEGMENT_REVIEW: ${VIDEOBOX_AUTO_APPROVE_SEGMENT_REVIEW:-1}
      VIDEOBOX_DATABASE_URL: postgresql://${POSTGRES_USER:-videobox}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env.container}@videobox-postgres:5432/${POSTGRES_DB:-videobox}
    volumes:
      - ${VIDEOBOX_CONTAINER_DATA_ROOT:?set VIDEOBOX_CONTAINER_DATA_ROOT in .env.container}/runtime:/videobox-data
      - ${VIDEOBOX_CONTAINER_DATA_ROOT:?set VIDEOBOX_CONTAINER_DATA_ROOT in .env.container}/snapshot:/videobox-snapshot:ro
      # The watcher moves settled files out of here into the library, so it
      # needs write access -- read-only would leave every file re-imported
      # on every pass.
      - ${VIDEOBOX_CONTAINER_DATA_ROOT:?set VIDEOBOX_CONTAINER_DATA_ROOT in .env.container}/drive-sync:/videobox-drive-sync
      - videobox_model_cache:/opt/models
    depends_on:
      videobox-postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:${VIDEOBOX_WEB_PORT:-5173}:8080"
    networks: [videobox-edge, videobox-internal]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    # PID 1 only needs to launch two already-unprivileged children.
    cap_add: [SETGID, SETUID]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    mem_limit: 2g
    cpus: 2.0
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3).read()"]
      interval: 5s
      timeout: 3s
      retries: 20
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"

  # Hermes is intentionally pre-auth only.  It starts without any network,
  # VideoBox data, DB, API, or host bridge access.  A later egress-gateway
  # slice must be complete before an interactive `hermes model` OAuth login.
  videobox-hermes-agent:
    image: nousresearch/hermes-agent@sha256:ad79951c26b7707c8c651f30780338d4f9bb17ddca19f6ea78eb27cbf83a3787
    profiles: [hermes-preauth]
    command: ["sleep", "infinity"]
    network_mode: none
    volumes:
      # This scratch state is deliberately not the later OAuth state volume.
      - videobox_hermes_preauth_state:/opt/data
    read_only: true
    tmpfs:
      - /tmp:uid=10000,gid=10000,mode=1777
      # s6-overlay places its supervised init binary under /run, so this
      # one tmpfs must remain executable while the root filesystem stays RO.
      - /run:rw,exec,nosuid,nodev,mode=0755
    cap_drop: [ALL]
    # The official s6 entrypoint needs these setup capabilities to own
    # /opt/data and supervise its hermes-owned run subtree.  The agent command
    # itself must run as the unprivileged hermes user with zero effective caps.
    cap_add: [CHOWN, DAC_OVERRIDE, SETGID, SETUID]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    mem_limit: 2g
    cpus: 2.0
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"

  # Interactive OAuth state is isolated from the pre-auth scratch volume and
  # from every VideoBox data, DB, API, and host mount.
  videobox-hermes-oauth-bootstrap:
    image: nousresearch/hermes-agent@sha256:ad79951c26b7707c8c651f30780338d4f9bb17ddca19f6ea78eb27cbf83a3787
    profiles: [hermes-oauth-bootstrap]
    command: ["sleep", "infinity"]
    volumes:
      - videobox_hermes_oauth_state:/opt/data
    networks: [videobox-hermes-egress]
    read_only: true
    tmpfs:
      - /tmp:uid=10000,gid=10000,mode=1777
      - /run:rw,exec,nosuid,nodev,mode=0755
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, SETGID, SETUID]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    mem_limit: 2g
    cpus: 2.0
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"

  # The official dashboard must bind a container interface for Docker port
  # forwarding. `--insecure` is required by Hermes for that bind, while the
  # published port remains host-loopback only. This service sees only the
  # OAuth state volume and the isolated provider egress network, never
  # VideoBox data, DB, API, or internal networks. Platform-only provider
  # configuration stays in the official Hermes dashboard.
  videobox-hermes-dashboard:
    image: nousresearch/hermes-agent@sha256:ad79951c26b7707c8c651f30780338d4f9bb17ddca19f6ea78eb27cbf83a3787
    profiles: [hermes-dashboard]
    command: ["dashboard", "--host", "0.0.0.0", "--port", "9119", "--insecure", "--no-open"]
    ports:
      - "127.0.0.1:9119:9119"
    volumes:
      - videobox_hermes_oauth_state:/opt/data
    networks: [videobox-hermes-provider-egress]
    read_only: true
    tmpfs:
      - /tmp:uid=10000,gid=10000,mode=1777
      - /run:rw,exec,nosuid,nodev,mode=0755
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, SETGID, SETUID]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    mem_limit: 2g
    cpus: 2.0
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"

networks:
  videobox-edge:
  videobox-internal:
    internal: true
  videobox-hermes-egress: {}
  videobox-hermes-provider-egress: {}

volumes:
  videobox_postgres_data:
  # Speech-to-text weights.  Separate from project data so model downloads never
  # touch the owner's footage, and persistent so a restart does not refetch.
  videobox_model_cache:
  videobox_hermes_preauth_state:
  videobox_hermes_oauth_state:
