x-videobox-hermes-capability-authority:
  schema_version: v1
  issuer: videobox-agent-gateway
  issuer_owner: gateway-only
  issuance_enabled: true
  signing_secret_delivery: gateway_private_environment_only
  durable_revocation_storage_primitive: ProjectStore.revoke_issued_hermes_capabilities
  owner_authorized_revocation_writer_status: deployed
  durable_consume_replay_boundary: ProjectStore.consume_registered_hermes_capability
  capability_gateway_route_status: existing_reserve_attach_stream_only
  signing_private_key_status: gateway_environment_only
  verification_public_key_status: workspace_environment_only
  capability_lifecycle_status: deployed
  gateway_audit_status: deployed_redacted
  key_replacement_mode: coordinated_single_key_only
  ordinary_api_paths: forbidden
  preauth_hermes_network_status: network_mode_none
  yujin_topology_status: deployed
  gateway_service_status: capability_lifecycle_deployed
  gateway_service: videobox-agent-gateway
  gateway_api_network: videobox-agent-gateway-api-network
  gateway_network: videobox-agent-gateway-network
  gateway_route_mode: existing_reserve_attach_stream_only

services:
  videobox-workspace:
    environment:
      VIDEOBOX_AGENT_GATEWAY_URL: http://videobox-agent-gateway:8081
      VIDEOBOX_AGENT_GATEWAY_SERVICE_TOKEN: ${VIDEOBOX_AGENT_GATEWAY_SERVICE_TOKEN:?set in .env.container}
      VIDEOBOX_HERMES_CAPABILITY_PUBLIC_KEY_B64: ${VIDEOBOX_HERMES_CAPABILITY_PUBLIC_KEY_B64:?set in .env.container}
      VIDEOBOX_HERMES_CAPABILITY_KEY_ID: ${VIDEOBOX_HERMES_CAPABILITY_KEY_ID:?set in .env.container}
    networks: [videobox-agent-gateway-api-network]

  videobox-agent-gateway:
    profiles: [hermes-yujin]
    build:
      context: .
      dockerfile: docker/agent-gateway.Dockerfile
    environment:
      HERMES_YUJIN_GATEWAY_USERNAME: ${HERMES_YUJIN_GATEWAY_USERNAME:?set in .env.container}
      HERMES_YUJIN_GATEWAY_PASSWORD: ${HERMES_YUJIN_GATEWAY_PASSWORD:?set in .env.container}
      HERMES_YUJIN_URL: http://videobox-hermes-yujin:9120
      VIDEOBOX_AGENT_GATEWAY_SERVICE_TOKEN: ${VIDEOBOX_AGENT_GATEWAY_SERVICE_TOKEN:?set in .env.container}
      VIDEOBOX_HERMES_CAPABILITY_PRIVATE_KEY_B64: ${VIDEOBOX_HERMES_CAPABILITY_PRIVATE_KEY_B64:?set in .env.container}
      VIDEOBOX_HERMES_CAPABILITY_KEY_ID: ${VIDEOBOX_HERMES_CAPABILITY_KEY_ID:?set in .env.container}
      HERMES_MEMORY_ADAPTER_URL: http://videobox-hermes-memory-adapter:8082
      VIDEOBOX_HERMES_MEMORY_ADAPTER_TOKEN: ${VIDEOBOX_HERMES_MEMORY_ADAPTER_TOKEN:?set in .env.container}
    depends_on:
      videobox-hermes-yujin:
        condition: service_healthy
      videobox-workspace:
        condition: service_healthy
    networks: [videobox-agent-gateway-api-network, videobox-agent-gateway-network, videobox-hermes-memory-network]
    user: "10001:10001"
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 64
    mem_limit: 256m
    cpus: 0.5
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8081/health', timeout=3).read()"]
      interval: 5s
      timeout: 3s
      retries: 20
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"

  videobox-hermes-memory-adapter:
    profiles: [hermes-yujin]
    build:
      context: .
      dockerfile: docker/hermes-memory-adapter.Dockerfile
    environment:
      MEM0_API_KEY: ${MEM0_API_KEY:-}
      VIDEOBOX_HERMES_MEMORY_ADAPTER_TOKEN: ${VIDEOBOX_HERMES_MEMORY_ADAPTER_TOKEN:?set in .env.container}
      # 기억을 이 컴퓨터 안에서만 돌린다. 기억 생성·검색을 로컬 모델이 맡고
      # 벡터 저장소는 파일 경로 방식이라 서버가 따로 없다. MEM0_API_KEY 가
      # 채워져 있으면 그쪽(호스팅)이 우선한다.
      VIDEOBOX_MEM0_MODE: ${VIDEOBOX_MEM0_MODE:-local}
      VIDEOBOX_MEM0_LOCAL_BASE_URL: ${VIDEOBOX_MEM0_LOCAL_BASE_URL:-http://host.docker.internal:1234/v1}
      VIDEOBOX_MEM0_LLM_MODEL: ${VIDEOBOX_MEM0_LLM_MODEL:-qwen/qwen3.6-35b-a3b}
      VIDEOBOX_MEM0_EMBEDDER_MODEL: ${VIDEOBOX_MEM0_EMBEDDER_MODEL:-text-embedding-bge-m3}
      # 차원이 틀리면 저장소가 조용히 어긋난다. bge-m3 는 1024다.
      VIDEOBOX_MEM0_EMBEDDING_DIMS: ${VIDEOBOX_MEM0_EMBEDDING_DIMS:-1024}
      VIDEOBOX_MEM0_STORE_PATH: ${VIDEOBOX_MEM0_STORE_PATH:-/var/lib/videobox-mem0/qdrant}
    volumes:
      # 기억이 재시작을 넘겨 살아남아야 한다. tmpfs 면 매번 사라진다.
      - videobox_mem0_store:/var/lib/videobox-mem0
    networks: [videobox-hermes-memory-network, videobox-hermes-provider-egress]
    user: "10000:10000"
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 64
    mem_limit: 256m
    cpus: 0.5
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8082/health', timeout=3).read()"]
      interval: 5s
      timeout: 3s
      retries: 20
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"

  videobox-hermes-yujin:
    profiles: [hermes-yujin]
    container_name: videobox-hermes-yujin
    image: nousresearch/hermes-agent@sha256:3811ed13da874fba2ac99b6d492db9a203d34cb6dccf90d886948c00d0ccec09
    # `hermes` must lead: s6-overlay execs the container CMD directly, so a bare
    # "-p" was passed to s6-applyuidgid and the container exited 127 before
    # Hermes started. Verified 2026-08-08 against the pinned digest.
    # `--isolated` 없이는 프로필 실행이 기계 전체 대시보드에 붙고 유진은 그저
    # "미리 선택"될 뿐이다. 그러면 웹소켓 세션이 default 프로필의 모델
    # (anthropic/claude-opus-4.6)로 열려 "No inference provider configured" 로
    # 죽는다. 2026-08-08 확인.
    command: ["hermes", "-p", "videobox-yujin", "serve", "--isolated", "--host", "0.0.0.0", "--port", "9120"]
    environment:
      HERMES_DASHBOARD_BASIC_AUTH_USERNAME: ${HERMES_YUJIN_GATEWAY_USERNAME:?set in .env.container}
      HERMES_DASHBOARD_BASIC_AUTH_PASSWORD_HASH: ${HERMES_YUJIN_GATEWAY_PASSWORD_HASH:?set in .env.container}
      HERMES_TUI_TOOLSETS: context_engine
      # 유진의 두뇌는 이 컴퓨터에서 도는 LM Studio 다. Hermes 에 내장된 lmstudio
      # 제공자가 이 두 값을 읽는다. LM Studio 는 열쇠를 확인하지 않으므로
      # LM_API_KEY 는 비밀이 아니라 자리를 채우는 값이다. 나중에 외부 모델로
      # 바꾸는 것은 Hermes 대시보드의 제공자 선택으로 한다.
      LM_BASE_URL: ${HERMES_YUJIN_LOCAL_MODEL_BASE_URL:-http://host.docker.internal:1234/v1}
      LM_API_KEY: ${HERMES_YUJIN_LOCAL_MODEL_API_KEY:-lm-studio}
    # host.docker.internal 은 Docker Desktop 이 자동으로 넣어 준다. extra_hosts 로
    # 직접 넣지 않는다 — 이름을 임의 주소로 돌릴 수 있어 A1 규칙이 금지한다.
    volumes:
      - videobox_hermes_oauth_state:/opt/data
      - ./config/hermes/yujin:/opt/videobox-yujin-profile:ro
    networks: [videobox-agent-gateway-network, videobox-hermes-provider-egress]
    read_only: true
    tmpfs:
      - /tmp:uid=10000,gid=10000,mode=1777
      - /run:rw,exec,nosuid,nodev,mode=0755
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, SETGID, SETUID]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    mem_limit: 2g
    cpus: 2.0
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9120/api/status', timeout=3).read()"]
      interval: 5s
      timeout: 3s
      retries: 20
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  # 자체 호스팅 Mem0 의 벡터 저장소. 이 컴퓨터 안에만 있다.
  videobox_mem0_store:

networks:
  videobox-agent-gateway-api-network:
    internal: true
  videobox-agent-gateway-network:
    internal: true
  videobox-hermes-memory-network:
    internal: true
