x-videobox-hermes-capability-authority:
  schema_version: v1
  issuer: videobox-agent-gateway
  issuer_owner: gateway-only
  issuance_enabled: true
  signing_secret_delivery: gateway_private_environment_only
  durable_revocation_storage_primitive: ProjectStore.revoke_issued_hermes_capabilities
  owner_authorized_revocation_writer_status: deployed
  durable_consume_replay_boundary: ProjectStore.consume_registered_hermes_capability
  capability_gateway_route_status: existing_reserve_attach_stream_only
  signing_private_key_status: gateway_environment_only
  verification_public_key_status: workspace_environment_only
  capability_lifecycle_status: deployed
  gateway_audit_status: deployed_redacted
  key_replacement_mode: coordinated_single_key_only
  ordinary_api_paths: forbidden
  preauth_hermes_network_status: network_mode_none
  yujin_topology_status: deployed
  gateway_service_status: capability_lifecycle_deployed
  gateway_service: videobox-agent-gateway
  gateway_api_network: videobox-agent-gateway-api-network
  gateway_network: videobox-agent-gateway-network
  gateway_route_mode: existing_reserve_attach_stream_only

services:
  videobox-workspace:
    environment:
      VIDEOBOX_AGENT_GATEWAY_URL: http://videobox-agent-gateway:8081
      VIDEOBOX_AGENT_GATEWAY_SERVICE_TOKEN: ${VIDEOBOX_AGENT_GATEWAY_SERVICE_TOKEN:?set in .env.container}
      VIDEOBOX_HERMES_CAPABILITY_PUBLIC_KEY_B64: ${VIDEOBOX_HERMES_CAPABILITY_PUBLIC_KEY_B64:?set in .env.container}
      VIDEOBOX_HERMES_CAPABILITY_KEY_ID: ${VIDEOBOX_HERMES_CAPABILITY_KEY_ID:?set in .env.container}
    networks: [videobox-agent-gateway-api-network]

  videobox-agent-gateway:
    profiles: [hermes-yujin]
    build:
      context: .
      dockerfile: docker/agent-gateway.Dockerfile
    environment:
      HERMES_YUJIN_GATEWAY_USERNAME: ${HERMES_YUJIN_GATEWAY_USERNAME:?set in .env.container}
      HERMES_YUJIN_GATEWAY_PASSWORD: ${HERMES_YUJIN_GATEWAY_PASSWORD:?set in .env.container}
      HERMES_YUJIN_URL: http://videobox-hermes-yujin:9120
      VIDEOBOX_AGENT_GATEWAY_SERVICE_TOKEN: ${VIDEOBOX_AGENT_GATEWAY_SERVICE_TOKEN:?set in .env.container}
      VIDEOBOX_HERMES_CAPABILITY_PRIVATE_KEY_B64: ${VIDEOBOX_HERMES_CAPABILITY_PRIVATE_KEY_B64:?set in .env.container}
      VIDEOBOX_HERMES_CAPABILITY_KEY_ID: ${VIDEOBOX_HERMES_CAPABILITY_KEY_ID:?set in .env.container}
    depends_on:
      videobox-hermes-yujin:
        condition: service_healthy
      videobox-workspace:
        condition: service_healthy
    networks: [videobox-agent-gateway-api-network, videobox-agent-gateway-network]
    user: "10001:10001"
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 64
    mem_limit: 256m
    cpus: 0.5
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8081/health', timeout=3).read()"]
      interval: 5s
      timeout: 3s
      retries: 20
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"

  videobox-hermes-yujin:
    profiles: [hermes-yujin]
    container_name: videobox-hermes-yujin
    image: nousresearch/hermes-agent@sha256:ad79951c26b7707c8c651f30780338d4f9bb17ddca19f6ea78eb27cbf83a3787
    command: ["-p", "videobox-yujin", "serve", "--host", "0.0.0.0", "--port", "9120"]
    environment:
      HERMES_DASHBOARD_BASIC_AUTH_USERNAME: ${HERMES_YUJIN_GATEWAY_USERNAME:?set in .env.container}
      HERMES_DASHBOARD_BASIC_AUTH_PASSWORD_HASH: ${HERMES_YUJIN_GATEWAY_PASSWORD_HASH:?set in .env.container}
      HERMES_TUI_TOOLSETS: context_engine
    volumes:
      - videobox_hermes_oauth_state:/opt/data
      - ./config/hermes/yujin:/opt/videobox-yujin-profile:ro
    networks: [videobox-agent-gateway-network, videobox-hermes-provider-egress]
    read_only: true
    tmpfs:
      - /tmp:uid=10000,gid=10000,mode=1777
      - /run:rw,exec,nosuid,nodev,mode=0755
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, SETGID, SETUID]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    mem_limit: 2g
    cpus: 2.0
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9120/api/status', timeout=3).read()"]
      interval: 5s
      timeout: 3s
      retries: 20
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"

networks:
  videobox-agent-gateway-api-network:
    internal: true
  videobox-agent-gateway-network:
    internal: true
